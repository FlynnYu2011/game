<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>企鹅蓄力跳跃</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b2841;font-family:system-ui,'Microsoft YaHei',sans-serif}#wrap{position:fixed;inset:0;overflow:hidden;background:#72c9e8}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none;padding:18px;color:#fff;text-shadow:2px 2px 3px #16465f;display:flex;justify-content:space-between;align-items:flex-start;font-weight:800}.panel{padding:10px 14px;background:#124968cc;border:3px solid #c8f5ff;border-radius:12px;box-shadow:4px 5px #0b3148}.score{font-size:clamp(18px,3vw,28px)}.best{font-size:13px;color:#b9efff}.height{text-align:right;font-size:16px}.charge{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(430px,64vw);height:24px;background:#143d54;border:4px solid #fff;border-radius:16px;overflow:hidden;box-shadow:3px 4px #153244}.chargeFill{height:100%;width:0;background:linear-gradient(90deg,#63e67b,#ffe45d,#ff704d);transition:width .03s}.chargeText{position:absolute;left:0;right:0;bottom:51px;text-align:center;color:white;font-weight:900;text-shadow:2px 2px #153244}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#08304cb8;padding:20px}.hidden{display:none!important}.card{width:min(650px,94vw);padding:30px;text-align:center;background:#eafaff;border:6px solid #174f6d;border-radius:22px;box-shadow:9px 10px #082d43;color:#153f58}.card h1{font-size:clamp(32px,7vw,62px);margin:0;color:#173e56;text-shadow:3px 3px #9bdcf2}.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.how div{padding:12px;background:#c9f0fa;border-radius:10px}.btn{min-height:52px;border:0;border-radius:50px;padding:13px 30px;font-size:18px;font-weight:900;color:#2d1900;background:#ffad32;box-shadow:inset 0 -5px #d16d14,4px 5px #17465e;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:inset 0 -2px #d16d14}.tip{position:absolute;bottom:78px;left:0;right:0;text-align:center;color:white;text-shadow:2px 2px #17465e;font-weight:700;pointer-events:none}@media(max-width:600px){.how{grid-template-columns:1fr}.card{padding:18px}.hud{padding:10px}.tip{font-size:12px}}
</style></head><body><main id="wrap"><canvas id="game" tabindex="0" aria-label="企鹅蓄力跳跃游戏画面"></canvas><div id="hud" class="hud hidden"><div class="panel"><div class="score">得分 <span id="score">0</span></div><div class="best">最高 <span id="best">0</span></div></div><div class="panel height">高度<br><span id="height">0</span>m</div><div class="chargeText" id="chargeText">落地后按住空格蓄力</div><div class="charge"><div id="charge" class="chargeFill"></div></div><div class="tip">A / D 或 ← / → 调整方向 · 按住空格/屏幕，松开起跳</div></div><section id="start" class="overlay"><div class="card"><h1>🐧 企鹅冲天</h1><div class="how"><div><b>按住</b><br>积蓄跳跃力量</div><div><b>松开</b><br>向高处弹射</div><div><b>控制</b><br>空中调整方向</div></div><button id="startBtn" class="btn">开始攀登</button><p>冰面会打滑，浮冰会移动，裂冰踩久会碎。</p></div></section><section id="over" class="overlay hidden"><div class="card"><h1 style="font-size:40px">跌入雪谷</h1><p>本次得分：<b id="final">0</b></p><button id="retryBtn" class="btn">再次攀登</button></div></section></main><script>
(()=>{const C=document.querySelector('#game'),x=C.getContext('2d'),$=s=>document.querySelector(s);let state='start',last=0,score=0,best=+(localStorage.penguinChargeBest||0),camera=0,highest=0,charge=0,charging=false,keys={left:false,right:false},p,plats=[],flakes=[];
function resize(){let r=C.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);C.width=r.width*d;C.height=r.height*d;C._d=d;C._w=r.width;C._h=r.height}addEventListener('resize',resize);resize();
function platform(y,xp,w,type='snow'){return{x:xp,y,w,h:18,type,vx:type==='moving'?(Math.random()<.5?-55:55):0,crack:0,dead:false}}
function init(){let w=C._w,h=C._h;p={x:w/2-22,y:h-120,w:44,h:50,vx:0,vy:0,grounded:true,landed:null,squash:0};plats=[platform(h-55,0,w,'snow')];let y=h-155;while(y>-h*1.4){let pw=Math.max(90,Math.min(210,w*.16+Math.random()*90)),px=30+Math.random()*(w-pw-60),r=Math.random(),type=r<.2?'ice':r<.36?'moving':r<.48?'crack':'snow';plats.push(platform(y,px,pw,type));y-=85+Math.random()*70}flakes=Array.from({length:70},()=>({x:Math.random()*w,y:Math.random()*h,s:1+Math.random()*3,v:15+Math.random()*35}));score=0;camera=0;highest=p.y;charge=0;charging=false;state='play';$('#start').classList.add('hidden');$('#over').classList.add('hidden');$('#hud').classList.remove('hidden');C.focus();hud()}
function addPlatforms(){let top=Math.min(...plats.filter(q=>!q.dead).map(q=>q.y));while(top>camera-C._h*.8){top-=85+Math.random()*70;let pw=Math.max(85,Math.min(210,C._w*.15+Math.random()*95)),type=Math.random()<.2?'ice':Math.random()<.35?'moving':Math.random()<.48?'crack':'snow';plats.push(platform(top,25+Math.random()*(C._w-pw-50),pw,type))}}
function release(){if(state!=='play'||!p.grounded)return;let power=.25+charge*.75;p.vy=-(480+power*520);p.vx+=(keys.left?-1:keys.right?1:0)*(150+charge*140);p.grounded=false;p.landed=null;p.squash=.18;charging=false;charge=0}
function update(dt){if(state!=='play')return;if(charging&&p.grounded)charge=Math.min(1,charge+dt*.72);let accel=(keys.right?1:0)-(keys.left?1:0);p.vx+=accel*620*dt;p.vx*=p.grounded&&p.landed?.type!=='ice'?Math.pow(.05,dt):Math.pow(.45,dt);p.vx=Math.max(-300,Math.min(300,p.vx));let steps=Math.max(1,Math.ceil(dt/.004)),sd=dt/steps;for(let n=0;n<steps;n++){let oldBottom=p.y+p.h;p.vy+=1150*sd;p.x+=p.vx*sd;p.y+=p.vy*sd;if(p.x<0){p.x=0;p.vx=Math.abs(p.vx)*.5}if(p.x+p.w>C._w){p.x=C._w-p.w;p.vx=-Math.abs(p.vx)*.5}p.grounded=false;for(const q of plats){if(q.dead)continue;let newBottom=p.y+p.h;if(p.vy>=0&&oldBottom<=q.y+2&&newBottom>=q.y&&p.x+p.w>q.x&&p.x<q.x+q.w){p.y=q.y-p.h;p.vy=0;p.grounded=true;p.landed=q;if(q.type==='moving')p.x+=q.vx*sd;break}}}for(const q of plats){if(q.type==='moving'){q.x+=q.vx*dt;if(q.x<10||q.x+q.w>C._w-10)q.vx*=-1}if(q.type==='crack'&&p.grounded&&p.landed===q){q.crack+=dt;if(q.crack>.7)q.dead=true}}if(p.grounded&&p.landed?.dead){p.grounded=false;p.vy=40}p.squash=Math.max(0,p.squash-dt);highest=Math.min(highest,p.y);let targetCam=p.y-C._h*.58;if(targetCam<camera)camera+=(targetCam-camera)*Math.min(1,dt*5);score=Math.max(score,Math.floor((C._h-120-highest)/10));if(score>best){best=score;localStorage.penguinChargeBest=best}addPlatforms();plats=plats.filter(q=>q.y-camera<C._h+150&&!q.dead);for(const f of flakes){f.y+=f.v*dt;if(f.y>C._h){f.y=-5;f.x=Math.random()*C._w}}if(p.y-camera>C._h+100)over();hud()}
function hud(){$('#score').textContent=score;$('#best').textContent=best;$('#height').textContent=score;$('#charge').style.width=charge*100+'%';$('#chargeText').textContent=p?.grounded?(charging?'蓄力 '+Math.round(charge*100)+'%':'按住空格或屏幕蓄力'):'空中调整方向'}function over(){state='over';$('#final').textContent=score;$('#over').classList.remove('hidden')}
function rr(a,b,w,h,c){x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),w,h)}function drawPenguin(){let px=p.x,py=p.y-camera;x.save();x.translate(px+p.w/2,py+p.h/2);if(p.vx<0)x.scale(-1,1);if(p.squash)x.scale(1.18,.82);rr(-18,-21,36,42,'#202b34');rr(-13,-5,27,23,'#f5fbff');rr(10,-7,14,8,'#f59f28');rr(5,-13,5,5,'#fff');rr(7,-12,2,2,'#111');rr(-23,-5,8,20,'#202b34');x.restore()}
function draw(){let d=C._d||1,w=C._w,h=C._h;x.setTransform(d,0,0,d,0,0);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#3b86bd');g.addColorStop(1,'#c7f3ff');x.fillStyle=g;x.fillRect(0,0,w,h);for(const f of flakes){x.globalAlpha=.7;rr(f.x,f.y,f.s,f.s,'#fff')}x.globalAlpha=1;for(const q of plats){let sy=q.y-camera;if(sy<-30||sy>h+30)continue;let colors={snow:['#eefcff','#8bd1e8'],ice:['#a9f5ff','#43badb'],moving:['#ffe08a','#e79030'],crack:['#e6f7ff','#8abfd1']}[q.type];rr(q.x,sy,q.w,q.h,colors[1]);rr(q.x,sy,q.w,7,colors[0]);if(q.type==='crack'&&q.crack>0){rr(q.x+q.w*.3,sy+5,3,10,'#547d91');rr(q.x+q.w*.62,sy+2,3,13,'#547d91')}}if(p)drawPenguin()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}function press(v){if(state!=='play')return;if(v&&p.grounded){charging=true}else if(!v&&charging)release()}
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(e.code==='Space'){e.preventDefault();press(true)}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false;if(e.code==='Space')press(false)});C.addEventListener('pointerdown',e=>{e.preventDefault();press(true)});C.addEventListener('pointerup',()=>press(false));C.addEventListener('pointercancel',()=>press(false));$('#startBtn').onclick=init;$('#retryBtn').onclick=init;requestAnimationFrame(loop)})();
</script></body></html>
