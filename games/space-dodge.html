<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>星海突围</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050713;color:white;font-family:system-ui,'Microsoft YaHei',sans-serif}#wrap{position:fixed;inset:0;background:#080b1b}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}.hud{position:absolute;inset:0;pointer-events:none;padding:16px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:2px 2px #000}.box{background:#080d25db;border:2px solid #297e9e;padding:9px 13px;box-shadow:4px 4px #02030a}.score{font-size:22px;font-weight:900;color:#68edff}.small{font-size:12px;color:#a8c9d7;line-height:1.6}.wave{text-align:right;font-weight:800}.wave b{font-size:24px;color:#ffdc69}.bars{position:absolute;left:16px;bottom:18px;width:min(330px,60vw)}.bar{height:14px;margin-top:7px;background:#111933;border:2px solid #3d5377}.fill{height:100%;transition:width .15s}.hp{background:#ff596e}.dash{background:#54e4d0}.power{background:#ad7cff}.tip{position:absolute;bottom:18px;right:18px;color:#a8c9d7;font-size:13px;text-shadow:2px 2px #000}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#030611d9;padding:20px}.hidden{display:none!important}.card{width:min(680px,95vw);padding:30px;text-align:center;background:#0e1733;border:4px solid #347e9e;box-shadow:inset 0 0 0 3px #17294c,8px 8px #02030a}.card h1{margin:0;font-size:clamp(36px,7vw,68px);color:#65ecff;text-shadow:4px 4px #334ca0}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.modes div{background:#18264a;padding:12px;border-top:3px solid #55dbe3}.btn{border:0;min-height:52px;padding:13px 28px;font-size:17px;font-weight:900;color:#03151c;background:#60e8ef;box-shadow:inset 0 -5px #2184a1,5px 5px #01030a;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:inset 0 -2px #2184a1}@media(max-width:600px){.modes{grid-template-columns:1fr}.card{padding:18px}.tip{font-size:10px}.box{padding:7px}.score{font-size:17px}}
</style></head><body><main id="wrap"><canvas id="game" tabindex="0" aria-label="星海突围游戏画面"></canvas><div id="hud" class="hud hidden"><div class="box"><div class="score">得分 <span id="score">0</span></div><div class="small">最高 <span id="best">0</span> · 连击 <span id="combo">×1</span></div></div><div class="box wave">航段 <b id="wave">1</b><div class="small" id="event">小行星带</div></div><div class="bars"><div class="small">护甲</div><div class="bar"><div id="hp" class="fill hp"></div></div><div class="small">冲刺</div><div class="bar"><div id="dash" class="fill dash"></div></div><div class="small">能量效果</div><div class="bar"><div id="power" class="fill power"></div></div></div><div class="tip">鼠标 / 触控 / A D 左右移动 · 空格冲刺</div></div><section id="start" class="overlay"><div class="card"><h1>🚀 星海突围</h1><p>左右闪避，穿越不断变化的星际危险区</p><div class="modes"><div><b>横向驾驶</b><br>保持航线，只需左右闪避</div><div><b>战术能力</b><br>护盾、缓速、冲刺</div><div><b>惊险擦弹</b><br>贴近危险获得连击</div></div><button id="startBtn" class="btn">启动引擎</button></div></section><section id="over" class="overlay hidden"><div class="card"><h1 style="color:#ff677d">飞船损毁</h1><p>最终得分：<b id="final">0</b></p><button id="retryBtn" class="btn">再次突围</button></div></section></main><script>
(()=>{const C=document.querySelector('#game'),x=C.getContext('2d'),$=s=>document.querySelector(s);let state='start',last=0,time=0,score=0,best=+(localStorage.spaceRunBest||0),wave=1,spawn=0,eventTimer=0,shake=0,flash=0,slow=0,stars=[],obs=[],shots=[],pickups=[],parts=[],keys={},mouse={x:0,y:0,active:false},p;
function resize(){let r=C.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);C.width=r.width*d;C.height=r.height*d;C._d=d;C._w=r.width;C._h=r.height;if(!mouse.active){mouse.x=r.width/2;mouse.y=r.height*.75}}addEventListener('resize',resize);resize();
function init(){let w=C._w,h=C._h;p={x:w/2,y:h*.78,r:14,hp:3,inv:0,dash:0,shield:0,combo:1,comboT:0};time=score=0;wave=1;spawn=.5;eventTimer=0;slow=0;obs=[];shots=[];pickups=[];parts=[];stars=Array.from({length:130},()=>({x:Math.random()*w,y:Math.random()*h,z:.3+Math.random()*1.7}));state='play';$('#start').classList.add('hidden');$('#over').classList.add('hidden');$('#hud').classList.remove('hidden');C.focus();hud()}
function burst(px,py,c,n=16){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=35+Math.random()*190;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.55,c,size:2+Math.random()*4})}}
function spawnThreat(){let w=C._w,r=Math.random();if(wave>=3&&r<.18){let gap=90+Math.random()*(w-180);obs.push({type:'wall',y:-35,gap,w:120,speed:125+wave*9,near:false})}else if(wave>=2&&r<.42){obs.push({type:'seeker',x:30+Math.random()*(w-60),y:-25,r:15,speed:105+wave*7,vx:0,near:false})}else{let size=14+Math.random()*27;obs.push({type:'rock',x:20+Math.random()*(w-40),y:-35,r:size,speed:130+Math.random()*100+wave*9,vx:(Math.random()-.5)*55,rot:0,near:false})}}
function spawnLaser(){let pos=C._w*(.15+Math.random()*.7);obs.push({type:'laser',vertical:true,pos,t:1.35,active:false,near:false});eventTimer=5}
function hit(d=1){if(p.inv>0)return;if(p.shield>0){p.shield=Math.max(0,p.shield-d);p.inv=.4;burst(p.x,p.y,'#75f5ff',18);return}p.hp-=d;p.inv=1;shake=14;flash=.18;burst(p.x,p.y,'#ff5f72',25);p.combo=1;if(p.hp<=0)over()}
function dash(){if(state!=='play'||p.dash>0)return;p.dash=2.4;p.inv=.32;let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);if(!dx)dx=p.facing||1;p.x+=dx*105;p.x=Math.max(p.r,Math.min(C._w-p.r,p.x));burst(p.x,p.y,'#69f4e0',24)}
function update(dt){if(state!=='play')return;let factor=slow>0?.55:1,sd=dt*factor;time+=dt;wave=1+Math.floor(time/18);eventTimer-=dt;slow=Math.max(0,slow-dt);p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.comboT-=dt;if(p.comboT<=0)p.combo=Math.max(1,p.combo-1);let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),speed=330;if(dx){p.facing=dx;p.x+=dx*speed*dt}else if(mouse.active){let delta=mouse.x-p.x;if(Math.abs(delta)>2)p.facing=Math.sign(delta);p.x+=delta*Math.min(1,dt*10)}p.x=Math.max(p.r,Math.min(C._w-p.r,p.x));p.y=C._h*.78;spawn-=sd;if(spawn<=0){spawnThreat();spawn=Math.max(.18,.72-wave*.035)*(Math.random()*.5+.75)}if(wave>=2&&eventTimer<=0&&Math.random()<dt*.3)spawnLaser();if(Math.random()<dt*.075)pickups.push({x:30+Math.random()*(C._w-60),y:-20,r:11,type:Math.random()<.48?'shield':'slow',speed:105});
for(const s of stars){s.y+=90*s.z*sd;if(s.y>C._h){s.y=0;s.x=Math.random()*C._w}}for(const o of obs){if(o.type==='laser'){o.t-=dt;if(o.t<.65)o.active=true;if(o.active){let dist=o.vertical?Math.abs(p.x-o.pos):Math.abs(p.y-o.pos);if(dist<p.r+10)hit()}continue}o.y+=o.speed*sd;if(o.type==='rock'){o.x+=o.vx*sd;o.rot+=sd*2}else if(o.type==='seeker'){o.vx+=(p.x-o.x)*sd*.8;o.vx=Math.max(-100,Math.min(100,o.vx));o.x+=o.vx*sd}let danger=false,near=false;if(o.type==='wall'){danger=!(p.x>o.gap-o.w/2&&p.x<o.gap+o.w/2)&&Math.abs(p.y-o.y)<24;near=Math.abs(p.y-o.y)<42}else{let dist=Math.hypot(p.x-o.x,p.y-o.y);danger=dist<p.r+o.r;near=dist<p.r+o.r+28}if(danger)hit();else if(near&&!o.near){o.near=true;p.combo=Math.min(9,p.combo+1);p.comboT=2.2;score+=25*p.combo;burst(p.x,p.y,'#ffe46b',6)}}obs=obs.filter(o=>o.type==='laser'?o.t>0:o.y<C._h+70);for(const q of pickups){q.y+=q.speed*sd;if(Math.hypot(p.x-q.x,p.y-q.y)<p.r+q.r){q.dead=true;if(q.type==='shield')p.shield=Math.min(3,p.shield+1);else slow=6;score+=150;burst(q.x,q.y,q.type==='shield'?'#64efff':'#bb83ff',20)}}pickups=pickups.filter(q=>!q.dead&&q.y<C._h+30);score+=dt*12*p.combo;if(score>best){best=Math.floor(score);localStorage.spaceRunBest=best}for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.life-=dt}parts=parts.filter(q=>q.life>0);shake*=.82;flash=Math.max(0,flash-dt);hud()}
function hud(){$('#score').textContent=Math.floor(score);$('#best').textContent=best;$('#combo').textContent='×'+p.combo;$('#wave').textContent=wave;$('#event').textContent=wave%4===0?'电磁风暴':wave%3===0?'激光封锁':wave%2===0?'追踪雷区':'小行星带';$('#hp').style.width=p.hp/3*100+'%';$('#dash').style.width=(1-Math.min(1,p.dash/2.4))*100+'%';$('#power').style.width=Math.max(p.shield/3,slow/6)*100+'%'}function over(){state='over';$('#final').textContent=Math.floor(score);$('#over').classList.remove('hidden')}
function rr(a,b,w,h,c){x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),w,h)}function draw(){let d=C._d||1,w=C._w,h=C._h;x.setTransform(d,0,0,d,0,0);rr(0,0,w,h,'#060918');x.save();x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);for(const s of stars){x.globalAlpha=s.z*.65;rr(s.x,s.y,s.z*2,s.z*5,'#d6f3ff')}x.globalAlpha=1;for(const o of obs){if(o.type==='laser'){x.globalAlpha=o.active?.8:.22;x.fillStyle=o.active?'#ff3d75':'#ffcb55';if(o.vertical)rr(o.pos-9,0,18,h,x.fillStyle);else rr(0,o.pos-9,w,18,x.fillStyle);x.globalAlpha=1;continue}if(o.type==='wall'){rr(0,o.y-16,o.gap-o.w/2,32,'#cc405d');rr(o.gap+o.w/2,o.y-16,w,32,'#cc405d');rr(o.gap-o.w/2,o.y-4,o.w,8,'#62e9ff')}else{x.save();x.translate(o.x,o.y);x.rotate(o.rot||0);x.fillStyle=o.type==='seeker'?'#e45cff':'#bc5264';x.beginPath();for(let i=0;i<8;i++){let a=i*.785,r=o.r*(i%2?1:.72);x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.fill();if(o.type==='seeker'){rr(-4,-4,8,8,'#fff07b')}x.restore()}}for(const q of pickups){x.fillStyle=q.type==='shield'?'#61ecff':'#b879ff';x.beginPath();x.arc(q.x,q.y,q.r,0,6.29);x.fill();rr(q.x-3,q.y-7,6,14,'#fff')}for(const q of parts){x.globalAlpha=Math.max(0,q.life*2);rr(q.x,q.y,q.size,q.size,q.c)}x.globalAlpha=1;if(p){x.save();x.translate(p.x,p.y);if(p.inv>0&&Math.floor(p.inv*18)%2)x.globalAlpha=.35;if(p.shield){x.strokeStyle='#65efff';x.lineWidth=3;x.beginPath();x.arc(0,0,p.r+8,0,6.29);x.stroke()}x.fillStyle='#64eaff';x.beginPath();x.moveTo(0,-p.r);x.lineTo(p.r*.8,p.r);x.lineTo(0,p.r*.55);x.lineTo(-p.r*.8,p.r);x.fill();rr(-4,-4,8,10,'#fff');x.restore()}x.restore();if(flash){rr(0,0,w,h,`rgba(255,50,80,${flash})`)}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}C.addEventListener('pointermove',e=>{let r=C.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.active=true});C.addEventListener('pointerdown',e=>{let r=C.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.active=true});addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();dash()}});addEventListener('keyup',e=>keys[e.key]=false);$('#startBtn').onclick=init;$('#retryBtn').onclick=init;requestAnimationFrame(loop)})();
</script></body></html>
