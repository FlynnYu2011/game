<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>霓虹弹球塔</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070914;color:#f5eecf;font-family:'ZCOOL KuaiLe',sans-serif}body{display:grid;place-items:center;background:radial-gradient(circle,#202650 0,#090b18 65%,#03040a)}
#gameWrap{position:relative;width:min(100vw,1050px);height:min(100vh,720px);overflow:hidden;border:4px solid #404a81;box-shadow:0 0 0 4px #090b18,0 0 36px #6657c880;background:#0a0e23}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;padding:15px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:2px 2px #000}.hudBox{background:#090d20e8;border:3px solid #55609a;box-shadow:inset 0 0 0 2px #20284e,4px 4px #02030a;padding:10px 13px;min-width:190px}.label{font-family:'Press Start 2P';font-size:8px;color:#8aa7d6;line-height:1.8}.value{font-family:'Press Start 2P';font-size:16px;color:#ffe16b}.right{text-align:right}.right .value{color:#7ff6dc}.status{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-family:'Press Start 2P';font-size:10px;color:#ffcf66;text-shadow:2px 2px #000;pointer-events:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#050714dd;padding:22px}.hidden{display:none!important}.card{width:min(720px,96%);padding:30px;text-align:center;background:#111633;border:5px solid #5965a0;box-shadow:inset 0 0 0 3px #252d59,9px 9px #02030a}.logo{font-family:'Press Start 2P';font-size:clamp(25px,5vw,48px);line-height:1.4;color:#ffdb64;text-shadow:4px 4px #d6497a,7px 7px #17112d;margin:0}.sub{letter-spacing:7px;color:#84dff1;margin:10px 0 24px}.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0;text-align:left}.how div{background:#1b2245;border-left:4px solid #6de4de;padding:12px}.how b{color:#ffd468}.btn{border:0;min-height:52px;padding:12px 24px;margin:8px;cursor:pointer;font-family:'Press Start 2P';font-size:11px;color:#181020;background:#ffd15c;box-shadow:inset -4px -4px #b66a33,inset 4px 4px #fff0a4,5px 5px #03040c}.btn:hover{transform:translate(-2px,-2px);box-shadow:inset -4px -4px #b66a33,inset 4px 4px #fff0a4,7px 7px #03040c}.btn:active{transform:translate(3px,3px);box-shadow:none}
#touch{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.touchGroup{display:flex;gap:10px}.touchBtn{pointer-events:auto;width:72px;height:58px;border:2px solid #78dce8;background:#111937cc;color:#fff;font-size:25px;border-radius:10px;touch-action:none}.touchBtn.active{background:#ec5e93;transform:translateY(3px)}
.scan{position:absolute;inset:0;pointer-events:none;opacity:.13;background:repeating-linear-gradient(0deg,transparent 0 3px,#000 4px)}
@media(pointer:fine){#touch .touchGroup{display:none}}@media(max-width:600px){.how{grid-template-columns:1fr}.card{padding:18px}.hudBox{min-width:135px;padding:7px}.value{font-size:11px}.status{top:92px}.sub{letter-spacing:3px}}
</style>
</head>
<body>
<main id="gameWrap">
<canvas id="game" width="1000" height="700" tabindex="0" aria-label="霓虹弹球游戏画面"></canvas><div class="scan"></div>
<div id="hud" class="hidden"><div class="hudBox"><div class="label">SCORE</div><div id="score" class="value">000000</div><div class="label">最高 <span id="best">000000</span></div></div><div class="hudBox right"><div class="label">BALL</div><div id="lives" class="value">● ● ●</div><div class="label">倍率 <span id="multiplier">×1</span></div></div></div><div id="status" class="status hidden">准备发射</div>
<div id="touch" class="hidden"><div class="touchGroup"><button class="touchBtn" data-key="left" aria-label="左挡板">◢</button><button class="touchBtn" data-key="right" aria-label="右挡板">◣</button></div><button class="touchBtn" data-key="launch" aria-label="发射弹球">⚡</button></div>
<section id="start" class="overlay"><div class="card"><h1 class="logo">霓虹<br>弹球塔</h1><div class="sub">NEON PINBALL</div><div class="how"><div><b>挡板</b><br>A / D 或 ← / →</div><div><b>发射</b><br>按住空格蓄力</div><div><b>目标</b><br>点亮符文提升倍率</div></div><button id="startBtn" class="btn">投入弹球</button><p>击中弹射器、符文靶和顶部通道，冲击最高分。</p></div></section>
<section id="over" class="overlay hidden"><div class="card"><h2 class="logo" style="font-size:32px">本局结束</h2><p>最终得分</p><div id="finalScore" class="value" style="font-size:28px;margin:18px">000000</div><button id="retryBtn" class="btn">再来一局</button></div></section>
</main>
<script>
(()=>{
const C=document.querySelector('#game'),ctx=C.getContext('2d'),$=s=>document.querySelector(s);ctx.imageSmoothingEnabled=false;
let state='start',last=0,score=0,best=+(localStorage.pinballBest||0),lives=3,multi=1,combo=0,comboTime=0,shake=0,flash=0,charge=0,ball,balls=[],particles=[],message='',messageTime=0,servePending=false;
const keys={left:false,right:false,launch:false};
const rollovers=[{x:275,y:102,r:13,on:false},{x:500,y:102,r:13,on:false},{x:725,y:102,r:13,on:false}],spinner={x:550,y:255,len:105,a:0,v:1};
const bumpers=[{x:350,y:175,r:34,c:'#ff5f87',v:800},{x:520,y:145,r:31,c:'#61e5df',v:1000},{x:675,y:215,r:35,c:'#ffbd59',v:820},{x:455,y:300,r:28,c:'#a879ff',v:680},{x:610,y:340,r:25,c:'#58b7ff',v:720},{x:320,y:400,r:23,c:'#ff7bd1',v:700}],targets=[{x:250,y:250,w:18,h:58,on:false},{x:755,y:300,w:18,h:58,on:false},{x:390,y:365,w:18,h:54,on:false},{x:690,y:415,w:18,h:54,on:false},{x:535,y:420,w:18,h:52,on:false},{x:210,y:345,w:18,h:52,on:false}];
const walls=[
 [120,80,840,80],[120,80,80,145],[80,145,80,530],[80,530,220,630],[880,80,880,620],[220,630,345,675],[655,675,790,630],[790,630,820,585],
 [160,165,245,112],[245,112,305,125],[805,170,730,115],[730,115,690,132],[150,440,235,505],[805,440,750,505],[820,120,820,595],[115,300,175,330],[805,285,745,320],[390,500,455,520],[610,500,545,520]
];
const flippers=[{x:335,y:585,len:145,base:.18,up:-.62,a:.18,key:'left',side:1},{x:665,y:585,len:145,base:Math.PI-.18,up:Math.PI+.62,a:Math.PI-.18,key:'right',side:-1}];
function resize(){let r=$('#gameWrap').getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);C.width=r.width*d;C.height=r.height*d;C._sx=r.width/1000;C._sy=r.height/700;C._d=d}addEventListener('resize',resize);resize();
function resetBall(){ball={x:850,y:570,vx:0,vy:0,r:9,ready:true,trail:[],age:0,stuck:0,spinnerCd:0};balls=[ball];charge=0;servePending=false;show('按住空格蓄力发射',2.2)}
function start(){score=0;lives=3;multi=1;combo=0;servePending=false;particles=[];targets.forEach(t=>t.on=false);rollovers.forEach(t=>t.on=false);spinner.a=0;spinner.v=1;state='play';$('#start').classList.add('hidden');$('#over').classList.add('hidden');$('#hud').classList.remove('hidden');$('#touch').classList.remove('hidden');resetBall();hud();C.focus()}
function show(t,d=1){message=t;messageTime=d;$('#status').textContent=t;$('#status').classList.remove('hidden')}
function addScore(n,x,y,c='#fff2a0'){n=Math.round(n*multi);score+=n;combo++;comboTime=2.8;particles.push({x,y,vy:-36,life:.8,text:'+'+n,c});if(score>best){best=score;localStorage.pinballBest=best}hud()}
function hud(){$('#score').textContent=String(score).padStart(6,'0');$('#best').textContent=String(best).padStart(6,'0');$('#lives').textContent='● '.repeat(lives).trim()||'—';$('#multiplier').textContent='×'+multi}
function burst(x,y,c,n=12){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=45+Math.random()*160;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.55,c,size:2+Math.random()*4})}}
function launch(){if(!ball?.ready)return;let power=680+charge*500;ball.ready=false;ball.vy=-power;ball.vx=0;burst(ball.x,ball.y,'#74edff',18);shake=7;charge=0;show('发射！',.6)}
function lineHit(b,x1,y1,x2,y2,bounce=1.02,boost=0){let dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy,t=Math.max(0,Math.min(1,((b.x-x1)*dx+(b.y-y1)*dy)/l2)),px=x1+t*dx,py=y1+t*dy,nx=b.x-px,ny=b.y-py,d=Math.hypot(nx,ny)||1;if(d<b.r+4){nx/=d;ny/=d;let dot=b.vx*nx+b.vy*ny;if(dot<0){b.x=px+nx*(b.r+5);b.y=py+ny*(b.r+5);b.vx=(b.vx-2*dot*nx)*bounce;b.vy=(b.vy-2*dot*ny)*bounce-boost;return true}}return false}
function circleHit(b,o){let dx=b.x-o.x,dy=b.y-o.y,d=Math.hypot(dx,dy)||1;if(d<b.r+o.r){let nx=dx/d,ny=dy/d;b.x=o.x+nx*(b.r+o.r+1);b.y=o.y+ny*(b.r+o.r+1);b.vx=nx*o.v;b.vy=ny*o.v;shake=7;flash=.08;burst(o.x,o.y,o.c,16);addScore(o.v, o.x,o.y,o.c);return true}return false}
function targetHit(b,t){if(b.x+b.r<t.x||b.x-b.r>t.x+t.w||b.y+b.r<t.y||b.y-b.r>t.y+t.h)return;let fromSide=Math.min(Math.abs(b.x-t.x),Math.abs(b.x-(t.x+t.w)))<Math.min(Math.abs(b.y-t.y),Math.abs(b.y-(t.y+t.h)));if(fromSide)b.vx*=-1.08;else b.vy*=-1.08;if(!t.on){t.on=true;addScore(750,t.x,t.y,'#f5ce68');burst(t.x,t.y,'#f5ce68',10);if(targets.every(q=>q.on)){targets.forEach(q=>q.on=false);multi=Math.min(5,multi+1);show('符文全亮 · 倍率提升！',1.5);spawnMultiBall();hud()}}}
function spawnMultiBall(){let b=balls[0];balls.push({x:b.x+12,y:b.y,vx:-b.vx*.8-120,vy:b.vy-100,r:9,ready:false,trail:[],age:0,stuck:0,spinnerCd:0});burst(b.x,b.y,'#fff',25)}
function rolloverHit(b){for(const r of rollovers)if(!r.on&&Math.hypot(b.x-r.x,b.y-r.y)<b.r+r.r){r.on=true;addScore(400,r.x,r.y,'#72efff');burst(r.x,r.y,'#72efff',8);if(rollovers.every(q=>q.on)){rollovers.forEach(q=>q.on=false);multi=Math.min(5,multi+1);show('星门贯通 · 多球奖励！',1.5);spawnMultiBall();hud()}}}
function update(dt){if(state!=='play')return;messageTime-=dt;if(messageTime<=0)$('#status').classList.add('hidden');comboTime-=dt;if(comboTime<=0){combo=0;multi=Math.max(1,multi-1);comboTime=999;hud()}spinner.a+=spinner.v*dt;spinner.v*=Math.pow(.3,dt);spinner.v+=dt*.8;if(keys.launch&&ball?.ready)charge=Math.min(1,charge+dt*.75);if(!keys.launch&&charge>0&&ball?.ready)launch();for(const f of flippers){let goal=keys[f.key]?f.up:f.base;f.a+=(goal-f.a)*Math.min(1,dt*24)}
for(const b of balls){if(b.ready){b.x=850;b.y=570+charge*52;continue}b.age+=dt;b.spinnerCd=Math.max(0,(b.spinnerCd||0)-dt);b.vy+=480*dt;b.vx*=.999;b.vy*=.999;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x>820&&b.y<125){b.x=760;b.y=190;b.vx=-320;b.vy=120;burst(b.x,b.y,'#74edff',8)}b.trail.unshift({x:b.x,y:b.y});if(b.trail.length>9)b.trail.pop();for(const w of walls)lineHit(b,...w,1.01);for(const f of flippers){let ex=f.x+Math.cos(f.a)*f.len,ey=f.y+Math.sin(f.a)*f.len;if(lineHit(b,f.x,f.y,ex,ey,1.04,keys[f.key]?260:10)){b.vx+=Math.cos(f.a)*(keys[f.key]?110:0);shake=3}}let sx=Math.cos(spinner.a)*spinner.len/2,sy=Math.sin(spinner.a)*spinner.len/2;if(lineHit(b,spinner.x-sx,spinner.y-sy,spinner.x+sx,spinner.y+sy,1.05,12)&&b.spinnerCd<=0){b.spinnerCd=.14;spinner.v=Math.min(12,spinner.v+3);addScore(300,spinner.x,spinner.y,'#78f2dc')}for(const o of bumpers)circleHit(b,o);for(const t of targets)targetHit(b,t);rolloverHit(b);if(b.x<95){b.x=95;b.vx=Math.abs(b.vx)}if(b.x>885){b.x=885;b.vx=-Math.abs(b.vx)}if(b.y<62){b.y=62;b.vy=Math.abs(b.vy)}let speed=Math.hypot(b.vx,b.vy);if(speed<115&&b.age>.55){b.stuck=(b.stuck||0)+dt;if(b.stuck>.32){let dx=500-b.x,dy=360-b.y,l=Math.hypot(dx,dy)||1;b.vx=dx/l*240+(Math.random()-.5)*70;b.vy=dy/l*240-80;b.stuck=0;show('自动脱困',.55);burst(b.x,b.y,'#ffde75',7)}}else b.stuck=0;if(b.y>730)b.dead=true}
balls=balls.filter(b=>!b.dead);if(!balls.length&&!servePending){servePending=true;lives--;hud();if(lives<=0){state='over';$('#finalScore').textContent=String(score).padStart(6,'0');$('#over').classList.remove('hidden');$('#touch').classList.add('hidden')}else setTimeout(()=>{if(state==='play')resetBall()},650)}else if(balls.length)ball=balls[0];for(const p of particles){p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;p.vy=(p.vy||0)+30*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);shake*=.84;flash=Math.max(0,flash-dt)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){let d=C._d||1,sx=C._sx||1,sy=C._sy||1;ctx.setTransform(d*sx,0,0,d*sy,0,0);ctx.clearRect(0,0,1000,700);ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);rect(0,0,1000,700,'#090d21');for(let y=0;y<700;y+=35)for(let x=0;x<1000;x+=35)rect(x+1,y+1,33,33,(x/35+y/35)%2?'#111735':'#0e142d');ctx.lineWidth=8;ctx.lineCap='square';ctx.strokeStyle='#5364ad';for(const w of walls){ctx.beginPath();ctx.moveTo(w[0],w[1]);ctx.lineTo(w[2],w[3]);ctx.stroke();ctx.strokeStyle='#7ee8e1';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='#5364ad';ctx.lineWidth=8}rect(822,95,56,510,'#0b1930');rect(826,99,4,500,'#56d9e2');
for(const r of rollovers){ctx.strokeStyle=r.on?'#fff5a8':'#4d6b9d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.29);ctx.stroke();rect(r.x-3,r.y-8,6,16,r.on?'#7ff5e8':'#263758')}for(const t of targets){rect(t.x,t.y,t.w,t.h,t.on?'#ffe16b':'#3b466f');rect(t.x+4,t.y+7,t.w-8,t.h-14,t.on?'#fff4af':'#626f9f')}for(const o of bumpers){ctx.globalAlpha=.25;ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(o.x,o.y,o.r+12+Math.sin(performance.now()/150)*4,0,6.29);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.29);ctx.fill();ctx.fillStyle='#fff6cb';ctx.beginPath();ctx.arc(o.x,o.y,o.r*.45,0,6.29);ctx.fill();rect(o.x-5,o.y-o.r*.7,10,o.r*1.4,'#ffffff88')}let ssx=Math.cos(spinner.a)*spinner.len/2,ssy=Math.sin(spinner.a)*spinner.len/2;ctx.strokeStyle='#7cf2de';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(spinner.x-ssx,spinner.y-ssy);ctx.lineTo(spinner.x+ssx,spinner.y+ssy);ctx.stroke();ctx.fillStyle='#fff0a5';ctx.beginPath();ctx.arc(spinner.x,spinner.y,9,0,6.29);ctx.fill();ctx.lineCap='square';
for(const f of flippers){let ex=f.x+Math.cos(f.a)*f.len,ey=f.y+Math.sin(f.a)*f.len;ctx.strokeStyle=keys[f.key]?'#fff0a8':'#ec5e93';ctx.lineWidth=22;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.strokeStyle='#672b66';ctx.lineWidth=6;ctx.stroke();ctx.lineCap='square'}
for(const b of balls){for(let i=b.trail.length-1;i>=0;i--){ctx.globalAlpha=(b.trail.length-i)/b.trail.length*.22;ctx.fillStyle='#6de9ff';ctx.beginPath();ctx.arc(b.trail[i].x,b.trail[i].y,b.r*(1-i/b.trail.length*.6),0,6.29);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#f9ffff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.29);ctx.fill();rect(b.x-4,b.y-5,4,4,'#9ceeff')}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);if(p.text){ctx.font='bold 12px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle=p.c;ctx.fillText(p.text,p.x,p.y)}else rect(p.x,p.y,p.size,p.size,p.c)}ctx.globalAlpha=1;if(ball?.ready){rect(905,600,20,-100*charge,'#ffcf5d');rect(902,595,26,7,'#fff0a5')}ctx.restore();if(flash){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,1000,700)}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t,steps=Math.max(1,Math.ceil(dt/.005));for(let i=0;i<steps;i++)update(dt/steps);draw();requestAnimationFrame(loop)}
function setKey(k,v){let was=keys[k];keys[k]=v;document.querySelector(`[data-key="${k}"]`)?.classList.toggle('active',v);if(k==='launch'&&was&&!v&&ball?.ready){charge=Math.max(.18,charge);launch()}}
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))setKey('left',true);if(['ArrowRight','d','D'].includes(e.key))setKey('right',true);if(e.code==='Space'){e.preventDefault();setKey('launch',true)}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))setKey('left',false);if(['ArrowRight','d','D'].includes(e.key))setKey('right',false);if(e.code==='Space')setKey('launch',false)});
document.querySelectorAll('.touchBtn').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();setKey(k,true)});b.addEventListener('pointerup',()=>setKey(k,false));b.addEventListener('pointercancel',()=>setKey(k,false))});$('#startBtn').onclick=start;$('#retryBtn').onclick=start;requestAnimationFrame(loop);
})();
</script>
</body>
</html>
