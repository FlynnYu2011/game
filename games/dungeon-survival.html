<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>深渊守夜人</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap');
    :root{--ink:#14101d;--cream:#f7e7bd;--gold:#ffc857;--red:#ff5d6c;--green:#68d391;--blue:#65c7f7}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09070e;color:var(--cream);font-family:'ZCOOL KuaiLe',system-ui,sans-serif}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#241b32 0,#0b0811 60%,#050407 100%)}
    #shell{position:relative;width:min(100vw,1280px);height:min(100vh,800px);overflow:hidden;box-shadow:0 0 0 4px #09070e,0 0 0 7px #503f60,0 24px 80px #000}
    canvas{width:100%;height:100%;display:block;image-rendering:pixelated;background:#110e17;cursor:crosshair}
    .scan{position:absolute;inset:0;pointer-events:none;opacity:.2;background:repeating-linear-gradient(0deg,transparent 0 3px,#000 4px)}
    #hud{position:absolute;inset:0;pointer-events:none;padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-shadow:2px 2px #000}
    .top{display:flex;justify-content:space-between;gap:12px}.panel{background:#100c18db;border:3px solid #5c496b;box-shadow:inset 0 0 0 2px #21182d,4px 4px #050407;padding:10px 12px}
    .stats{width:min(440px,58vw)}.row{display:flex;align-items:center;gap:9px;margin:4px 0;font-family:'Press Start 2P',monospace;font-size:9px}.bar{height:13px;flex:1;background:#21192c;border:2px solid #08060c}.fill{height:100%;transition:width .2s}.hp{background:#e84a5f}.xp{background:#54b9e8}.dash{background:#e6b84d}
    .wave{text-align:right;font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.8}.wave strong{font-size:18px;color:var(--gold)}
    .bottom{display:flex;justify-content:space-between;align-items:end}.tips{font-size:15px;color:#d2bfd8}.combo{font-family:'Press Start 2P';font-size:11px;color:var(--gold);text-align:right}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;background:#07050bd9;padding:20px}.hidden{display:none!important}.box{max-width:780px;width:100%;background:#171020;border:5px solid #6d577b;box-shadow:inset 0 0 0 3px #2f213c,10px 10px #030204;padding:30px;text-align:center}.logo{font-family:'Press Start 2P';font-size:clamp(25px,5vw,55px);line-height:1.35;color:#ffe19a;text-shadow:4px 4px #7c3045,8px 8px #190f22;margin:0 0 8px}.sub{letter-spacing:8px;color:#bd9bc6;margin-bottom:26px}.pixelBtn{pointer-events:auto;cursor:pointer;border:0;color:#1b1121;background:#f3bd4d;font-family:'Press Start 2P';font-size:12px;padding:16px 24px;box-shadow:inset -4px -4px #b66e32,inset 4px 4px #ffe29a,5px 5px #08060b;margin:8px}.pixelBtn:hover{transform:translate(-2px,-2px);box-shadow:inset -4px -4px #b66e32,inset 4px 4px #ffe29a,7px 7px #08060b}.pixelBtn:active{transform:translate(3px,3px);box-shadow:none}
    .how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0;text-align:left}.how div{background:#21182c;padding:12px;border-left:4px solid #a276aa}.how b{color:#ffd067}.tiny{color:#aa95b1;font-size:13px;line-height:1.55}
    #choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.choice{cursor:pointer;background:#241a30;border:3px solid #624c70;color:#f7e7bd;padding:18px 12px;min-height:170px}.choice:hover{border-color:#ffc857;transform:translateY(-5px);background:#332340}.choice .icon{font-size:36px}.choice h3{color:#ffd474;margin:8px 0}.choice p{font-size:14px;color:#cbb8d0;line-height:1.4}.result{font-family:'Press Start 2P';font-size:12px;line-height:2;color:#d8c7dd}.result strong{font-size:30px;color:#ffcb66}
    @media(max-width:650px){#shell{height:100vh}.how{grid-template-columns:1fr}.how div{padding:7px}.box{padding:18px}.sub{letter-spacing:3px}.tips{font-size:11px}.stats{width:68vw}.panel{padding:7px}.wave{font-size:7px}.wave strong{font-size:12px}#choices{grid-template-columns:1fr}.choice{min-height:0;padding:8px}.choice .icon{font-size:24px}.choice p{margin:4px}.upgrade.box{max-height:90vh;overflow:auto}}
  </style>
</head>
<body>
<main id="shell">
  <canvas id="game" width="960" height="600" aria-label="深渊守夜人游戏画面"></canvas><div class="scan"></div>
  <div id="hud" class="hidden"><div class="top"><div class="panel stats"><div class="row"><span>HP</span><div class="bar"><div id="hp" class="fill hp"></div></div><span id="hpText">100</span></div><div class="row"><span>XP</span><div class="bar"><div id="xp" class="fill xp"></div></div><span id="lv">LV1</span></div><div class="row"><span>冲刺</span><div class="bar"><div id="dash" class="fill dash"></div></div><span id="coins">◈ 0</span></div></div><div class="panel wave">第 <strong id="wave">1</strong> 夜<br><span id="timer">00:00</span> · 击杀 <span id="kills">0</span></div></div><div class="bottom"><div class="panel tips">WASD 移动 · 鼠标瞄准/攻击 · 空格冲刺 · P 暂停</div><div id="combo" class="panel combo">守住火种</div></div></div>
  <section id="start" class="overlay"><div class="box"><h1 class="logo">深渊<br>守夜人</h1><div class="sub">DUNGEON SURVIVOR</div><div class="how"><div><b>移动</b><br>WASD / 方向键</div><div><b>战斗</b><br>鼠标瞄准并点击</div><div><b>冲刺</b><br>空格穿越险境</div></div><button id="startBtn" class="pixelBtn">点燃火种</button><p class="tiny">在无尽的地牢中生存。收集灵魂升级，击败每夜出现的精英怪。</p></div></section>
  <section id="levelup" class="overlay hidden"><div class="box upgrade"><h2 class="logo" style="font-size:28px">灵魂觉醒</h2><p>选择一项永久强化</p><div id="choices"></div></div></section>
  <section id="pause" class="overlay hidden"><div class="box"><h2 class="logo" style="font-size:34px">时间凝固</h2><button id="resumeBtn" class="pixelBtn">继续守夜</button></div></section>
  <section id="over" class="overlay hidden"><div class="box"><h2 class="logo" style="font-size:35px;color:#ff7381">火种熄灭</h2><p class="result">你撑过了 <strong id="finalTime">00:00</strong><br>击退 <span id="finalKills">0</span> 个深渊造物 · 抵达等级 <span id="finalLv">1</span></p><button id="retryBtn" class="pixelBtn">再次点燃</button></div></section>
</main>
<script>
(()=>{
const C=document.querySelector('#game'),x=C.getContext('2d');x.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s), keys={}, mouse={x:480,y:300,down:false}; let state='start',last=0,shake=0,flash=0;
const rooms=[]; for(let i=0;i<60;i++) rooms.push({x:(i%10)*96,y:Math.floor(i/10)*100,n:Math.random()});
let p=null,enemies=[],bullets=[],gems=[],particles=[],time=0,wave=1,kills=0,nextSpawn=0;
const upgrades=[
 {icon:'⚔️',name:'磨利长剑',desc:'伤害 +35%',go:()=>p.damage*=1.35},
 {icon:'🫀',name:'鲜红誓约',desc:'最大生命 +30，并回复生命',go:()=>{p.maxHp+=30;p.hp=Math.min(p.maxHp,p.hp+45)}},
 {icon:'💨',name:'疾风步',desc:'移动速度 +15%',go:()=>p.speed*=1.15},
 {icon:'✨',name:'灵魂磁石',desc:'拾取范围大幅增加',go:()=>p.magnet+=55},
 {icon:'🏹',name:'连弩机关',desc:'攻击速度 +22%',go:()=>p.fireRate*=.78},
 {icon:'🔥',name:'贯穿火种',desc:'投射物可多贯穿 1 个敌人',go:()=>p.pierce++},
 {icon:'💎',name:'丰饶魂晶',desc:'经验获取 +30%',go:()=>p.xpGain*=1.3},
 {icon:'🛡️',name:'古老护甲',desc:'受到伤害 -18%',go:()=>p.armor=Math.min(.65,p.armor+.18)}
];
function reset(){p={x:480,y:300,r:12,hp:100,maxHp:100,speed:180,damage:24,fireRate:.32,shot:0,level:1,xp:0,need:8,magnet:75,pierce:0,xpGain:1,armor:0,dash:0,inv:0,coins:0};enemies=[];bullets=[];gems=[];particles=[];time=0;wave=1;kills=0;nextSpawn=.6;state='play';$('.overlay:not(.hidden)')?.classList.add('hidden');$('#hud').classList.remove('hidden');}
function resize(){const r=$('#shell').getBoundingClientRect(),ratio=Math.min(2,devicePixelRatio||1);C.width=Math.floor(r.width*ratio);C.height=Math.floor(r.height*ratio);C._ratio=ratio;} addEventListener('resize',resize);resize();
function pos(e){const r=C.getBoundingClientRect();mouse.x=(e.clientX-r.left)*C.width/r.width/(C._ratio||1);mouse.y=(e.clientY-r.top)*C.height/r.height/(C._ratio||1)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'&&state==='play'&&p.dash<=0){p.dash=2;p.inv=.28;const d=dir();p.x+=d.x*70;p.y+=d.y*70;burst(p.x,p.y,'#f5d77a',14)}if(e.key.toLowerCase()==='p'&&(state==='play'||state==='pause'))togglePause()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);C.addEventListener('mousemove',pos);C.addEventListener('mousedown',e=>{pos(e);mouse.down=true});addEventListener('mouseup',()=>mouse.down=false);
function dir(){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l}}
function spawn(){let side=Math.floor(Math.random()*4),w=C.width/C._ratio,h=C.height/C._ratio,ex=side===1?w+30:side===3?-30:Math.random()*w,ey=side===0?-30:side===2?h+30:Math.random()*h;let elite=Math.random()<Math.min(.28,wave*.025),type=Math.random()<.22?'bat':'ghoul',hp=(type==='bat'?22:42)*(1+wave*.16)*(elite?3.2:1);enemies.push({x:ex,y:ey,r:type==='bat'?10:14,hp,max:hp,speed:(type==='bat'?85:47)*(1+wave*.035),type,elite,hit:0,phase:Math.random()*6.3})}
function shoot(){let a=Math.atan2(mouse.y-p.y,mouse.x-p.x);bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*460,vy:Math.sin(a)*460,life:1.15,r:5,damage:p.damage,left:p.pierce});p.shot=p.fireRate;burst(p.x+Math.cos(a)*16,p.y+Math.sin(a)*16,'#ffd76b',4)}
function burst(px,py,c,n){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=Math.random()*120+25;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.5,c,size:2+Math.random()*4})}}
function update(dt){if(state!=='play')return;time+=dt;wave=1+Math.floor(time/25);p.shot-=dt;p.dash=Math.max(0,p.dash-dt);p.inv=Math.max(0,p.inv-dt);const d=dir(),w=C.width/C._ratio,h=C.height/C._ratio;p.x=Math.max(18,Math.min(w-18,p.x+d.x*p.speed*dt));p.y=Math.max(18,Math.min(h-18,p.y+d.y*p.speed*dt));if(mouse.down&&p.shot<=0)shoot();nextSpawn-=dt;if(nextSpawn<=0){spawn();nextSpawn=Math.max(.16,.85-wave*.035)*(Math.random()*.45+.75)}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}for(const e of enemies){let dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;e.x+=dx/l*e.speed*dt;e.y+=dy/l*e.speed*dt;e.phase+=dt*7;e.hit=Math.max(0,e.hit-dt);if(l<e.r+p.r&&p.inv<=0){p.hp-= (e.elite?20:11)*(1-p.armor);p.inv=.7;shake=10;flash=.16;burst(p.x,p.y,'#ff5268',12);if(p.hp<=0)gameOver()}}
for(const b of bullets)for(const e of enemies){if(b.life<=0||e.hp<=0)continue;if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){e.hp-=b.damage;e.hit=.1;burst(b.x,b.y,'#ffc857',5);if(b.left--<=0)b.life=0;if(e.hp<=0){kills++;let amount=e.elite?5:1;for(let q=0;q<amount;q++)gems.push({x:e.x+(Math.random()-.5)*18,y:e.y+(Math.random()-.5)*18,v:1});burst(e.x,e.y,e.elite?'#ffc857':'#a95fc4',15);shake=e.elite?8:3}}}
enemies=enemies.filter(e=>e.hp>0);bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.y>-20&&b.x<w+20&&b.y<h+20);
for(const g of gems){let dx=p.x-g.x,dy=p.y-g.y,l=Math.hypot(dx,dy)||1;if(l<p.magnet){let s=120+(p.magnet-l)*5;g.x+=dx/l*s*dt;g.y+=dy/l*s*dt}if(l<20){g.dead=true;p.xp+=g.v*p.xpGain;p.coins++;if(p.xp>=p.need)levelUp()}}gems=gems.filter(g=>!g.dead);
for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;q.life-=dt}particles=particles.filter(q=>q.life>0);shake*=.88;flash=Math.max(0,flash-dt);hud()}
function levelUp(){p.xp-=p.need;p.level++;p.need=Math.ceil(p.need*1.32+3);state='level';let picks=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);$('#choices').innerHTML='';picks.forEach(u=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<div class="icon">${u.icon}</div><h3>${u.name}</h3><p>${u.desc}</p>`;b.onclick=()=>{u.go();$('#levelup').classList.add('hidden');state='play'};$('#choices').appendChild(b)});$('#levelup').classList.remove('hidden')}
function gameOver(){state='over';$('#finalTime').textContent=clock(time);$('#finalKills').textContent=kills;$('#finalLv').textContent=p.level;$('#over').classList.remove('hidden')}
function togglePause(){if(state==='play'){state='pause';$('#pause').classList.remove('hidden')}else if(state==='pause'){state='play';$('#pause').classList.add('hidden')}}
function hud(){$('#hp').style.width=Math.max(0,p.hp/p.maxHp*100)+'%';$('#hpText').textContent=Math.ceil(p.hp);$('#xp').style.width=p.xp/p.need*100+'%';$('#lv').textContent='LV'+p.level;$('#dash').style.width=(1-Math.min(1,p.dash/2))*100+'%';$('#coins').textContent='◈ '+p.coins;$('#wave').textContent=wave;$('#timer').textContent=clock(time);$('#kills').textContent=kills;$('#combo').textContent=wave%5===0?'精英之夜！':'守住火种'}function clock(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function rect(px,py,w,h,c){x.fillStyle=c;x.fillRect(Math.round(px),Math.round(py),w,h)}
function draw(){let r=C._ratio||1,w=C.width/r,h=C.height/r;x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,h);x.save();x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);rect(0,0,w,h,'#15101c');let ts=48;for(let yy=0;yy<h;yy+=ts)for(let xx=0;xx<w;xx+=ts){let n=rooms[(Math.floor(xx/ts)+Math.floor(yy/ts)*10)%rooms.length].n;rect(xx+1,yy+1,ts-2,ts-2,n>.55?'#211827':'#1b1422');if(n>.82)rect(xx+8,yy+10,5,3,'#382641')}for(const g of gems){x.save();x.translate(g.x,g.y);x.rotate(time*2);rect(-5,-5,10,10,'#52d6ff');rect(-2,-5,4,4,'#d7f7ff');x.restore()}for(const b of bullets){rect(b.x-5,b.y-3,10,6,'#fff3b0');rect(b.x-2,b.y-2,8,4,'#ff9f43')}for(const e of enemies)drawEnemy(e);for(const q of particles){x.globalAlpha=Math.max(0,q.life*2);rect(q.x,q.y,q.size,q.size,q.c)}x.globalAlpha=1;if(p)drawPlayer();x.restore();if(flash){x.fillStyle=`rgba(255,45,70,${flash})`;x.fillRect(0,0,w,h)}}
function drawEnemy(e){x.save();x.translate(Math.round(e.x),Math.round(e.y+Math.sin(e.phase)*2));if(e.elite){x.fillStyle='#ffbd4a';x.fillRect(-e.r-4,-e.r-7,(e.r+4)*2,(e.r+4)*2)}x.fillStyle=e.hit?'#fff':e.type==='bat'?'#7551a5':'#9d3f5b';if(e.type==='bat'){rect(-17,-5,12,8,x.fillStyle);rect(5,-5,12,8,x.fillStyle);rect(-8,-9,16,18,x.fillStyle)}else{rect(-e.r,-e.r,e.r*2,e.r*2,x.fillStyle);rect(-e.r+3,e.r,e.r*2-6,5,'#5e263d')}rect(-7,-4,4,4,'#ffd86b');rect(3,-4,4,4,'#ffd86b');if(e.elite){rect(-e.r,-e.r-11,e.r*2,4,'#281726');rect(-e.r,-e.r-11,e.r*2*(e.hp/e.max),4,'#ffcf55')}x.restore()}
function drawPlayer(){x.save();x.translate(Math.round(p.x),Math.round(p.y));let a=Math.atan2(mouse.y-p.y,mouse.x-p.x);x.rotate(a);if(p.inv>0&&Math.floor(p.inv*20)%2)x.globalAlpha=.35;rect(-10,-11,20,22,'#d8c2a2');rect(-12,-8,5,14,'#4a2c5a');rect(-4,-15,9,6,'#7a405c');rect(2,-7,4,4,'#ffe47a');rect(7,-3,21,6,'#d9e5db');rect(20,-2,10,4,'#ffcd66');x.restore()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
$('#startBtn').onclick=reset;$('#retryBtn').onclick=reset;$('#resumeBtn').onclick=togglePause;requestAnimationFrame(loop);
})();
</script>
</body>
</html>
